name: Repository check

on:
  push:
  pull_request:
  workflow_dispatch:

# A beginner exercise gets a beginner-sized pipeline: does it import, do the
# three tests pass, is the syntax clean. There is nothing here worth more.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Lint
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check .
